<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniNote — Offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #0b1220; color: #f4f6fa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .badge {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #1976d2 0%, #42a5f5 60%, #90caf9 100%);
    display: grid; place-items: center;
    box-shadow: 0 12px 30px rgba(25,118,210,.35);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9aa4b2; margin: 0 0 20px; max-width: 340px; }
  button {
    font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: inherit;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body>
  <div>
    <div class="badge">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M5 16c-1.7 0-3-1.3-3-3s1.3-3 3-3c.2-2.8 2.5-5 5.5-5 2.6 0 4.8 1.7 5.4 4.1.3-.1.7-.1 1.1-.1 2.2 0 4 1.8 4 4s-1.8 4-4 4H5Z" fill="#fff" fill-opacity=".95" />
        <path d="M8.5 13.5v-3l3 3v-3" stroke="#1976d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page hasn't been opened before while online, so it isn't cached yet. Your notes are still safe — open a page you've already visited, or reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
