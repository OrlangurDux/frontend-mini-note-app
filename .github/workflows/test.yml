name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: src/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # Production build — same command the Dockerfile runs, so a broken
      # build fails here instead of during the deploy workflow's image build.
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:9077/api/v1
          NEXT_PUBLIC_SIGNUP_CONFIRMATION_MODE: simple
