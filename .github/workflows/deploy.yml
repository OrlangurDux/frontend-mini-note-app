name: Deploy

# Runs only on the stable branch and version tags — not on pull_request, so
# fork PRs never get a token with package-write access.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase image path; github.repository preserves
      # the repo's actual case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # This workflow only ever runs on a `master` push or a `v*` tag push
      # (see `on:` above), so `latest` applies unconditionally to both —
      # `enable={{is_default_branch}}` would look right but is wrong here:
      # it's false for tag pushes (a tag isn't a branch), so `latest` would
      # silently stop following version-tag releases.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Build args mirror docker-compose.yml's production build. Override
      # the defaults via repo Settings -> Secrets and variables -> Actions ->
      # Variables if this deployment should point at a different API by
      # default (the app's in-browser domain switcher can also override it
      # per-user at runtime, so this is only the seed value).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USER=${{ vars.APP_UID || '1000' }}
            GROUP=${{ vars.APP_GID || '1000' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:9077/api/v1' }}
            NEXT_PUBLIC_SIGNUP_CONFIRMATION_MODE=${{ vars.NEXT_PUBLIC_SIGNUP_CONFIRMATION_MODE || 'simple' }}
